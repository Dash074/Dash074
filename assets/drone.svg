<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <style>
    .hover { animation: hover 2.4s ease-in-out infinite; }
    .prop  { animation: spin 0.18s linear infinite; transform-box: fill-box; transform-origin: center; }
    .shadow{ animation: shadow 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .blink { animation: blink 1s steps(2) infinite; }
    .scan  { animation: scan 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    @keyframes hover  { 0%,100% { transform: translateY(0) rotate(-1.5deg);} 50% { transform: translateY(-18px) rotate(1.5deg);} }
    @keyframes spin   { to { transform: rotate(360deg);} }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity:.35;} 50% { transform: scaleX(.75); opacity:.18;} }
    @keyframes blink  { 0% { opacity:1;} 100% { opacity:.15;} }
    @keyframes scan   { 0%,100% { transform: scaleX(.7); opacity:.25;} 50% { transform: scaleX(1.05); opacity:.5;} }
  </style>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36BCF7" stop-opacity=".7"/>
      <stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse class="shadow" cx="200" cy="270" rx="90" ry="9" fill="#36BCF7"/>
  <g class="hover">
    <polygon class="scan" points="185,165 215,165 260,262 140,262" fill="url(#beam)"/>
    <line x1="200" y1="140" x2="95"  y2="105" stroke="#8b949e" stroke-width="7" stroke-linecap="round"/>
    <line x1="200" y1="140" x2="305" y2="105" stroke="#8b949e" stroke-width="7" stroke-linecap="round"/>
    <line x1="200" y1="140" x2="120" y2="165" stroke="#8b949e" stroke-width="7" stroke-linecap="round"/>
    <line x1="200" y1="140" x2="280" y2="165" stroke="#8b949e" stroke-width="7" stroke-linecap="round"/>
    <g fill="#2c5364">
      <rect x="85" y="95" width="20" height="14" rx="3"/><rect x="295" y="95" width="20" height="14" rx="3"/>
      <rect x="110" y="155" width="20" height="14" rx="3"/><rect x="270" y="155" width="20" height="14" rx="3"/>
    </g>
    <g fill="#36BCF7" fill-opacity=".55">
      <ellipse class="prop" cx="95"  cy="92"  rx="42" ry="6"/>
      <ellipse class="prop" cx="305" cy="92"  rx="42" ry="6"/>
      <ellipse class="prop" cx="120" cy="152" rx="42" ry="6"/>
      <ellipse class="prop" cx="280" cy="152" rx="42" ry="6"/>
    </g>
    <rect x="170" y="122" width="60" height="38" rx="10" fill="#0f2027" stroke="#36BCF7" stroke-width="2"/>
    <circle cx="200" cy="141" r="8" fill="#203a43" stroke="#36BCF7" stroke-width="2"/>
    <circle class="blink" cx="178" cy="129" r="3" fill="#ff5f56"/>
    <circle class="blink" cx="222" cy="129" r="3" fill="#27c93f" style="animation-delay:.5s"/>
  </g>
</svg>
